spring.application.name=plateforme_de_don

# Tests : BD H2 en memoire (auto-configuree par Spring Boot), isolee de la BD
# fichier utilisee par l'application (pas de spring.datasource.* ici : Boot
# configure automatiquement une H2 memoire avec un schema frais).

# Bonne pratique API REST : pas de requetes BD pendant la serialisation
spring.jpa.open-in-view=false

# Authentification explicite (DaoAuthenticationProvider dans SecurityConfig) :
# le warning de InitializeUserDetailsBeanManagerConfigurer est volontairement ignore
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Notifications e-mail des nouvelles annonces correspondant aux recherches
# sauvegardees. Hote SMTP local : les envois en echec sont interceptes et
# n'empechent jamais la creation d'annonce.
spring.mail.host=localhost
spring.mail.port=3025
app.notifications.email-active=true
