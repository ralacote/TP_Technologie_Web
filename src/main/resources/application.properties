spring.application.name=plateforme_de_don

# Bonne pratique API REST : pas de requêtes BD pendant la sérialisation
spring.jpa.open-in-view=false

# Authentification explicite (DaoAuthenticationProvider dans SecurityConfig) : le
# warning de InitializeUserDetailsBeanManagerConfigurer est volontairement ignoré
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
