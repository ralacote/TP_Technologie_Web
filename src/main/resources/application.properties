spring.application.name=plateforme_de_don

# BD embarquee en dev : fichier H2 pour conserver les donnees entre les
# redemarrages (les comptes et annonces survivent, et l'identifiant en cache
# du navigateur reste valide). En production : URL d'un serveur PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/plateforme
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Bonne pratique API REST : pas de requêtes BD pendant la sérialisation
spring.jpa.open-in-view=false

# Authentification explicite (DaoAuthenticationProvider dans SecurityConfig) : le
# warning de InitializeUserDetailsBeanManagerConfigurer est volontairement ignoré
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Notifications e-mail des nouvelles annonces correspondant aux recherches
# sauvegardees (désactivable globalement, et par recherche). Hôte SMTP local :
# les envois en échec sont interceptés et n'empêchent jamais la création d'annonce.
spring.mail.host=localhost
spring.mail.port=3025
app.notifications.email-active=true

# Passage a l'echelle : cache HTTP (voir WebConfig). Ressources statiques (CSS) :
# stockees une heure par le navigateur ; les reponses dynamiques utilisent
# l'ETag (Cache-Control: no-cache = revalidation a chaque requete -> 304).
spring.web.resources.cache.period=1h
